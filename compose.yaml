# FlashForge WebUI - Docker Compose example.
#
#   docker compose up -d
#
# Then open http://<host-ip>:3000 (default password: changeme).
services:
  flashforge-webui:
    image: ghcr.io/parallel-7/flashforge-webui:latest
    container_name: flashforge-webui
    restart: unless-stopped
    # Host networking lets the WebUI discover printers with the UDP broadcast and
    # reach them directly, and lets camera WebRTC work without extra setup.
    # With host networking, the WebUI listens on port 3000 of the host.
    network_mode: host
    # Forwards stop signals and reaps the go2rtc child process.
    init: true
    volumes:
      - flashforge-data:/data
    # Default: reconnect every saved printer on start. Other options:
    #   ["--last-used"], ["--no-printers"], ["--webui-port=3001"]
    # command: ["--all-saved-printers"]

volumes:
  flashforge-data:
