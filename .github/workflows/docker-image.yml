name: Publish Docker Image

# Builds the multi-arch container image from the Linux binaries attached to a
# GitHub Release and pushes it to GHCR (ghcr.io/parallel-7/flashforge-webui).
#
# - release.yml calls this after it creates a release, so every release
#   (stable and pre-release) gets a matching image.
# - Run it by hand to (re)publish the image for a release that already exists.
#
# Tags: a stable release pushes X.Y.Z, X.Y, and latest. A pre-release pushes
# its full version (e.g. 1.2.1-alpha.1) and alpha. latest never moves to a
# pre-release.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 1.2.1)'
        type: string
        required: true
      prerelease:
        description: 'Whether the release is a pre-release'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version without the leading v (e.g. 1.2.0)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tags
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          # Same normalization as release.yml (1 -> 1.0.0, 1.2 -> 1.2.0).
          if [[ "$VERSION" == *.* && "$VERSION" != *.*.* ]]; then
            VERSION="${VERSION}.0"
          elif [[ "$VERSION" != *.* ]]; then
            VERSION="${VERSION}.0.0"
          fi

          IMAGE="ghcr.io/${OWNER,,}/flashforge-webui"
          if [[ "$PRERELEASE" == "true" ]]; then
            TAGS="${IMAGE}:${VERSION},${IMAGE}:alpha"
          else
            MINOR="${VERSION%.*}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:${MINOR},${IMAGE}:latest"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAGS}"

      - name: Download and verify release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p docker-bin
          declare -A ASSETS=(
            [linux-amd64]=flashforge-webui-linux-x64.bin
            [linux-arm64]=flashforge-webui-linux-arm64.bin
            [linux-armv7]=flashforge-webui-linux-armv7.bin
          )
          assets_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets')"
          for target in "${!ASSETS[@]}"; do
            name="${ASSETS[$target]}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "docker-bin/${target}"
            # Check the file against the SHA-256 digest GitHub recorded at upload.
            expected="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .digest // empty' <<< "$assets_json")"
            if [[ -n "$expected" ]]; then
              actual="sha256:$(sha256sum "docker-bin/${target}" | cut -d' ' -f1)"
              if [[ "$actual" != "$expected" ]]; then
                echo "Digest mismatch for ${name}: expected ${expected}, got ${actual}" >&2
                exit 1
              fi
              echo "${name}: ${actual} (verified)"
            else
              echo "::warning::No digest recorded for ${name}; skipped verification"
            fi
          done
          ls -lh docker-bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
