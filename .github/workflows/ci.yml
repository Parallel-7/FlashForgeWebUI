name: CI

on:
  push:
    branches: [main, alpha]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [main, alpha]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      emulator-ref:
        description: 'flashforge-emulator-v2 git ref to run the E2E track against'
        required: false
        default: 'v0.2.0'
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout FlashForgeWebUI
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Configure GitHub Packages Authentication
        shell: bash
        run: |
          echo "@ghosttypes:registry=https://npm.pkg.github.com" >> .npmrc
          echo "@parallel-7:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Build (backend + webui)
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

  e2e-emulator:
    name: E2E (emulator + browser)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - name: Checkout FlashForgeWebUI
        uses: actions/checkout@v4

      # The emulator lives in a separate public repo and provides the printers this
      # track drives, so no real hardware is needed. Pinned to a release tag so an
      # emulator change cannot silently break or silently change this CI; bump the
      # tag (or dispatch with emulator-ref) to pick up a new emulator release.
      - name: Checkout flashforge-emulator-v2
        uses: actions/checkout@v4
        with:
          repository: GhostTypes/flashforge-emulator-v2
          ref: ${{ inputs.emulator-ref || 'v0.2.0' }}
          path: emulator

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Configure GitHub Packages Authentication
        shell: bash
        run: |
          echo "@ghosttypes:registry=https://npm.pkg.github.com" >> .npmrc
          echo "@parallel-7:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install emulator dependencies
        working-directory: emulator
        run: npm ci
        env:
          # Only the emulator's headless runtime is used here; skip the large
          # Electron binary download this repo's e2e-tests track never launches.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The browser track needs the chromium binary itself, not just its system libraries.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Unlike FlashForgeUI-Electron's CI there is no xvfb-run and no chrome-sandbox
      # fixup here: this track drives the plain Node server (dist/index.js) with
      # headless Chromium, never a real Electron window.
      - name: Run browser E2E against the emulator
        run: pnpm run test:e2e
        env:
          FF_EMULATOR_ROOT: ${{ github.workspace }}/emulator

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
